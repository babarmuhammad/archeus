<!doctype html>
<html lang="en" data-theme="dark" data-motion="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>V2 Live</title>
<meta name="description" content="A simulated Archeus app that responds to every window size. Fixture data, nothing is connected to a Core.">
<meta name="theme-color" content="#0B090E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FDFCF8" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Archeus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="js/constellation/map.css">
<link rel="stylesheet" href="js/constellation/territories.css">
<link rel="stylesheet" href="css/now.css">
<link rel="stylesheet" href="css/work.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/inspector.css">
<link rel="stylesheet" href="css/picker.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/areas.css">
<link rel="stylesheet" href="css/replay.css">
<link rel="stylesheet" href="css/tui.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/autopilot.css">
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search), s = JSON.parse(localStorage.getItem('archeus-v2-live')) || {};
    var t = q.get('theme') || s.theme, m = q.get('motion') || s.motion, n = q.get('notes') || s.notes, l = q.get('lang') || s.lang;
    if (t) document.documentElement.dataset.theme = t;
    if (m) document.documentElement.dataset.motion = m;
    document.documentElement.dataset.notes = n === 'off' ? 'off' : 'on';
    if (l === 'it') document.documentElement.lang = 'it';
  } catch (e) { /* storage blocked: defaults apply */ }
})();
</script>
</head>
<body>
<div id="toolbar" role="toolbar" aria-label="Prototype controls"></div>
<div id="framenote" hidden></div>
<div id="stage"><div id="device"></div></div>
<noscript><p style="padding:16px">V2 Live needs JavaScript. It is a prototype with fixture data; nothing is connected to a Core.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
