name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The GUI smoke check needs a browser, so it is too slow for every PR but
    # too valuable to never run: it is the only thing that proves the SPA mounts,
    # paints every page, builds every scene and parks its frame loop.
    - cron: '17 4 * * 1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10; test the ends of that claim, not just the
        # middle. 3.13/3.14 were never exercised despite being supported.
        python-version: ['3.10', '3.12', '3.13', '3.14']
        os: [windows-latest]
        # The POSIX port has one input backend and one spawn table to get
        # wrong, not a per-version surface — one interpreter each is the
        # signal, and four more would only re-run the same branch.
        include:
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: macos-latest, python-version: '3.12'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Collected-test floor
        # A suite that silently stops collecting still reports success. This repo
        # already learned that from tools/smoke_gui.py, which printed
        # "FAILURES: none" while running zero checks.
        shell: pwsh
        run: |
          $out = python -m pytest tests/ --collect-only -q
          $line = $out | Select-String -Pattern '(\d+) tests collected' | Select-Object -First 1
          if (-not $line) { $out | Select-Object -Last 5; throw 'could not read the collected count' }
          $n = [int]$line.Matches[0].Groups[1].Value
          Write-Host "collected $n tests"
          if ($n -lt 1300) { throw "collected only $n tests — expected at least 1300" }
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Verify package imports
        run: python -c "import sys; sys.path.insert(0, '.'); import claude_sessions.main, claude_sessions.ui, claude_sessions.mcp, claude_sessions.claude_md, claude_sessions.session_menu, claude_sessions.system_prompt; print('imports OK')"

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      # Rule set is deliberately narrow (see [tool.ruff.lint] in pyproject): the
      # bug-finding rules only. First run on this codebase found three live
      # NameErrors and two loop-variable closures.
      - run: python -m ruff check .

  docs:
    # Builds the site on every push/PR so a broken docs change fails here rather
    # than in the deploy workflow. pages.yml stays purely about deploying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      # Install the built wheel into a clean venv and read the data files back
      # OUT of site-packages. The source tree always has them, which is why the
      # import smoke check above could not catch the empty-skills_templates bug.
      - name: Install the wheel and check the shipped data files
        shell: pwsh
        run: |
          python -m venv .wheeltest
          # $IsWindows is pwsh-only and absent in Windows PowerShell 5.1, where
          # the Scripts path is the right answer anyway.
          $py = if ($IsWindows -eq $false) { '.wheeltest/bin/python' }
                else { '.wheeltest\Scripts\python.exe' }
          $whl = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          & $py -m pip install --quiet $whl
          & $py -c "import claude_sessions.skills as s, glob, os, sys; d=s.bundled_templates_dir(); n=len(glob.glob(os.path.join(d,'*','SKILL.md'))); print('templates:', n, d); sys.exit(0 if n >= 8 else 1)"
          & $py -c "import claude_sessions.gui_html as g, sys; sys.exit(0 if len(g.PAGE) > 10000 and g.VENDOR_FILES else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'the wheel is missing shipped data files' }

      # The one command a fresh install types. Run from the INSTALLED console
      # script, not from the source tree: the point is that the released
      # artifact answers it, and reports the version it really is.
      - name: The installed console script answers --help
        shell: pwsh
        run: |
          $exe = if ($IsWindows -eq $false) { '.wheeltest/bin/archeus' }
                 else { '.wheeltest\Scripts\archeus.exe' }
          # Out-String: `& exe` yields an ARRAY of lines, and on an array
          # `-notmatch` is the FILTER operator — it returns every line that does
          # not match, which for multi-line help is a non-empty (truthy) array.
          # The check therefore threw no matter what the command printed; it had
          # never run before the release that added it.
          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'archeus --help failed' }
          if ($help -notmatch 'USAGE' -or $help -notmatch 'COMMANDS') {
            Write-Host $help
            throw 'archeus --help printed no usage'
          }
          $ver = (& $exe --version).Trim()
          $want = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($ver -ne $want.Trim()) { throw "archeus --version says $ver, pyproject says $want" }

  plugin:
    # The same validation the community plugin review runs. Cheap, and the
    # failure it catches — a manifest a user cannot install — is invisible
    # from inside the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./plugin
      - name: The bundled skills match the package templates
        run: python tools/gen_plugin.py --check
      - name: The generated API reference is current
        run: python tools/gen_api_docs.py --check

  www:
    # The marketing site at claudectl.space. Vercel builds it on every push, but
    # a build that only fails in the deploy is a build nobody sees fail on a PR —
    # the same reason the `docs` job exists alongside pages.yml.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gui-smoke:
    # Scheduled only — needs a Chromium download and a software GL stack.
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install chromium
      - run: python tools/smoke_gui.py
