name: release

# Publishes to PyPI via trusted publishing (OIDC) — no API token is stored
# anywhere. Register the publisher on PyPI BEFORE pushing the first tag:
#   https://pypi.org/manage/account/publishing/
#   owner: babarmuhammad   repo: archeus
#   workflow: release.yml  environment: pypi
#
# Inert until a v* tag is pushed.

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # A version/tag mismatch is unrecoverable: PyPI never allows a version to
      # be re-uploaded, so publishing 1.6.0 from tag v1.7.0 burns both numbers.
      - name: The tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$ver"
          test "$tag" = "$ver"

      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token; this is what replaces an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
        env:
          GH_TOKEN: ${{ github.token }}
