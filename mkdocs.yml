site_name: archeus
site_description: >-
  The memory and workspace layer for AI coding agents. Persistent per-project memory,
  every session you have ever had, and control over what the next one costs. Works with
  Claude Code, OpenAI Codex and pi, in a fast terminal UI or a native desktop GUI.
  Zero runtime dependencies.
# Canonical host. The manual lives on its own subdomain; the apex is the marketing
# site and is a different deployment entirely. The site is built by Vercel and
# mirrored on GitHub Pages; both copies emit this URL, so search and answer engines
# index one of them rather than splitting the same content across two domains.
# Asset and page links stay relative, which is why one site_url serves both.
site_url: https://docs.claudectl.space/
site_author: Babar Muhammad Anas
repo_url: https://github.com/babarmuhammad/archeus
repo_name: babarmuhammad/archeus
edit_uri: edit/main/docs/
copyright: MIT licensed — Copyright &copy; 2026 Babar Muhammad Anas

docs_dir: docs

# The master artwork lives in docs/assets because tools/make_icon.py derives the
# favicon, the app icon, the header logo and the manifest icons from it, and one
# source for a mark is the whole point (brand study 5.1). It is 1254px and 998 KB
# and NOTHING on the site links it — `theme.logo` is the 256px derivative — so
# publishing it put a megabyte into every deploy that no reader ever requests.
exclude_docs: |
  assets/logo.png
  # Internal engineering documents (the V1 blueprint and its research). They
  # live beside the manual so the repo has one docs tree, but are not pages;
  # tests/test_docs_site.py reads this block and exempts them from the nav gate.
  /architecture/
  /design/
  /research/

theme:
  name: material
  custom_dir: overrides
  # docs/img holds only tool-generated screenshots (test_demo_fixtures guards
  # that); brand assets live in docs/assets.
  favicon: assets/favicon.ico
  # The master dark tile, straight from docs/assets — the header logo, the
  # favicon and the app icon are all the one artwork (brand study 5.1).
  # The 256px derivative, not the 1254px master: this draws about 30px tall in
  # the header of every page, and the master was 998 KB of it.
  logo: assets/logo-256.png
  # No Google Fonts fetch — the GUI itself ships zero CDN requests, and the site
  # holds the same line.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Emits site/llms-full.txt at build time — the companion to the hand-written
# docs/llms.txt index. Generated, not committed, so it can never fall behind.
hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # No `pymdownx.snippets`. It was here for docs/changelog.md and
  # docs/code-of-conduct.md, which pulled the root CHANGELOG.md and
  # CODE_OF_CONDUCT.md; both pages moved to the apex marketing site and neither
  # file exists, so no page has held an `--8<--` marker for some time. Config
  # for a feature nothing uses is a claim the repo cannot back —
  # `test_no_page_uses_an_include_the_build_cannot_expand` fails the build if a
  # marker comes back without the extension.
  - toc:
      permalink: true

# Sections named after the app's own. The first is the manual, read top to
# bottom: what it is, how to install it, then one page per surface. The five
# after it are the five sections of the GUI sidebar and the five submenus of the
# terminal main menu, carrying the same names in the same order — so a screen
# and the page describing it are called the same thing, which is the whole
# reason they were renamed. The last is everything you look something up in
# rather than read.
#
# navigation.sections is on above, so a top-level key renders as a heading in
# the sidebar rather than a collapsible page.
#
# The product pitch is NOT here — it belongs to the marketing site on the apex.
# compare/credits are the last of it and are parked at the end of Reference
# until those pages exist there; moving them first would 404 links that are
# already live.
nav:
  - Manual:
      - Home: index.md
      - Getting started: getting-started.md
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Command line: cli.md
      - Terminal UI: tui.md
      - Desktop app: desktop.md
      - Claude Code plugin: plugin.md
      - Projects: projects.md
      - Sessions: sessions.md
      - Troubleshooting: troubleshooting.md
  - Context:
      - Project memory: memory.md
      - Architecture graph: architecture.md
      - MCP servers: mcp.md
  - Library:
      - Agents & skills: agents.md
      - Agent library install: agent-library.md
      - Hooks: hooks.md
  - Activity:
      - Usage & cost: usage.md
      - Project dashboard: dashboard.md
  - Accounts:
      - Multiple accounts: accounts.md
      - Context hand-off: context-handoff.md
  - Settings:
      - Configuration: configuration.md
      - More than one CLI: harnesses.md
      - Model providers: providers.md
      - Plan → Execute & OmniRoute: plan-execute.md
      - Status line, failover & checkpoints: statusline.md
  - Reference:
      - API reference: api.md
      - Files, layout & encoding: reference.md
      - Compare: compare.md
      - Credits: credits.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/babarmuhammad/archeus
      name: archeus on GitHub

  # schema.org `sameAs` for the author entity, emitted on every page by
  # overrides/main.html. An unrelated Rust project publishes under this name,
  # so what identifies THIS archeus is one author corroborated by a set of
  # profiles that link back. Must stay in step with `PROFILES` in
  # www/lib/site.ts — both hosts have to assert the same entity or the graph
  # says there are two of them.
  author: Babar Muhammad Anas
  apex: https://claudectl.space
  profiles:
    - https://github.com/babarmuhammad
    - https://www.linkedin.com/in/muhammad-anas-babar-819647240
    - https://dev.to/muhammad_anasbabar_31256
    - https://babarmuhammad.hashnode.dev
    - https://www.instagram.com/muhammad_anas_babar
